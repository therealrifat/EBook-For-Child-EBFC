<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <style>
    /* ১. মূল কন্টেইনার (বাইরের হলুদ বর্ডার ও পুরো লেআউট) */
    .card-container {
      display: flex;
      align-items: center;
      background-color: #fdd835; /* বাইরের হলুদ বর্ডার */
      border-radius: 12px;
      padding: 3px; /* বর্ডারের পুরুত্ব */
      max-width: 550px;
      font-family: Arial, sans-serif;
    }

    /* ২. পুরো ভেতরের সেকশন (অফ-হোয়াইট ব্যাকগ্রাউন্ড) */
    .card-body {
      display: flex;
      align-items: center;
      background-color: #f9f8f3; /* হালকা অফ-হোয়াইট ব্যাকগ্রাউন্ড */
      width: 100%;
      border-radius: 10px;
      overflow: hidden; /* শেপগুলো সঠিকভাবে বর্ডার কাটার জন্য */
    }

    /* ৩. বামপাশের লাল অ্যারো ট্যাগ (পড়ি ও শিখি) */
    .badge-wrapper {
      background-color: #fdd835; /* ট্যাগের চারপাশের হলুদ বর্ডার আউটলাইন */
      padding: 2px 2px 2px 0;
      clip-path: polygon(0% 0%, 78% 0%, 100% 50%, 78% 100%, 0% 100%);
      flex-shrink: 0;
    }

    .badge {
      background-color: #d81b60; /* লাল/পিঙ্ক ব্যাকগ্রাউন্ড */
      color: #ffeb3b; /* হলুদ ফন্ট কালার */
      padding: 12px 22px 12px 14px;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
      line-height: 1.2;
      clip-path: polygon(0% 0%, 78% 0%, 100% 50%, 78% 100%, 0% 100%);
    }

    /* ৪. ডানপাশের প্রশ্নের তালিকা */
    .content-list {
      padding: 10px 15px;
      color: #212121;
    }

    .content-list ol {
      margin: 0;
      padding-left: 0;
      list-style: none; /* ডিফল্ট ব্রাউজার স্টাইল বাদ দেওয়া */
    }

    .content-list li {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 6px;
      display: flex;
      gap: 8px;
    }

    .content-list li:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <!-- পুরো বক্স লেআউট -->
  <div class="card-container">
    <div class="card-body">
      
      <!-- বামপাশের অ্যারো ট্যাগ -->
      <div class="badge-wrapper">
        <div class="badge">
          পড়ি<br>ও শিখি
        </div>
      </div>

      <!-- ডানপাশের লেখার অংশ -->
      <div class="content-list">
        <ol>
          <li><span>১।</span> <span>কি থেকে পুষ্টি মেলে?</span></li>
          <li><span>২।</span> <span>ভাল্লুক নাচে কি মনে?</span></li>
        </ol>
      </div>

    </div>
  </div>

</body>
</html>
